name: CI/CD Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js on GitHub runner
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check essential files and JavaScript syntax
        shell: bash
        run: |
          test -f index.html
          test -f css/style.css
          test -d js
          find js -name '*.js' -type f -print0 | xargs -0 -r -n 1 node --check

      - name: Verify required Vercel secrets
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
